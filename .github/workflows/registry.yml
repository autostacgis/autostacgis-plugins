name: Plugin registry
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check plugin version bumps
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/build_manifest.py --check-base "origin/$BASE_REF"
      - run: mkdir -p public && python scripts/build_manifest.py --ref "$GITHUB_SHA" --output public/plugins.json
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: public
  publish:
    if: github.event_name == 'push'
    needs: manifest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
