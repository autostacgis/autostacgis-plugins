goal:
  plugin: metadata-value
  settings:
    jsonata: $lookup(asset, "cf:standard_name")
    value: surface_bidirectional_reflectance
    observes:
    - assets.$asset.cf:standard_name
    kind: raster
    for_each: true
    parameters:
      aoi:
      - -156.5
      - 20.5
      - -156.0
      - 21.0
    select:
      kind: raster
      require:
        jsonata: $intersects(item.bbox, parameters.aoi)
