solver:
  backward_chain: {}
goal:
  metadata-value:
    kind: raster
    select:
      require:
        assets.$asset.data_state:spectral_sampling: multispectral
    for_each: true
    jsonata: (asset.`data_state:relative_radiometric_normalization` = true and asset.`data_state:pansharpened`
      = true)
    value: true
