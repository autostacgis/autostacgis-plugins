# Request fragment; select metadata-value and a suitable aggregation in the catalog.
goal:
  plugin: metadata-value
  settings:
    jsonata: '$covers(item.geometry, parameters.aoi)'
    value: true
    observes: [geometry]
    kind: raster
    parameters:
      aoi: [-156.5, 20.5, -156.0, 21.0]
    select:
      kind: raster
      require:
        jsonata: '$intersects(item.geometry, parameters.aoi)'
