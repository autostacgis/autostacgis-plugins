[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "autostacgis-plugins"
version = "1.0.0"
description = "Single-capability geospatial plugins for AutoSTACGIS"
requires-python = ">=3.12"
readme = "README.md"
license = "GPL-3.0-only"
dependencies = ["autostacgis==1.0.0"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["plugins/autostacgis_plugins"]

[tool.hatch.build.targets.sdist]
include = ["/plugins", "/examples", "/docs", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.optional-dependencies]
atmosphere = ["Py6S>=1.9,<2"]
spectralmatch = ["spectralmatch @ git+https://github.com/spectralmatch/spectralmatch.git@6c73cb2fe8a8d975e3233bb907e1a1caa4414b3d"]
registration = ["coregix>=0.3,<0.4", "opencv-python-headless>=4.10,<5"]
cloud = ["omnicloudmask>=1,<2"]
pointcloud = ["laspy[lazrs]>=2,<3"]
distributed = ["dask[distributed]>=2025"]
triggers = ["APScheduler>=3.11,<4", "watchdog>=6,<7"]
s3 = ["boto3>=1.35,<2"]
telemetry = ["opentelemetry-sdk>=1,<2"]
dev = ["pytest>=8,<10", "ruff>=0.12", "build>=1,<2"]

